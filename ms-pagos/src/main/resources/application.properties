spring.application.name=MS-PAGOS
server.port=8088

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pagos_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

eureka.client.serviceurl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

jwt.secret=${JWT_SECRET}

# Webpay Plus - ambiente de pruebas (credenciales públicas de Transbank)
webpay.url=${WEBPAY_URL:https://webpay3gint.transbank.cl}
webpay.codigo-comercio=${WEBPAY_CODIGO_COMERCIO:597055555532}
webpay.api-key=${WEBPAY_API_KEY:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}
webpay.return-url=${WEBPAY_RETURN_URL:http://localhost:8080/api/pagos/retorno}

front.url=${FRONT_URL:http://localhost:5173}