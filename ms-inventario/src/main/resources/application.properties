spring.application.name=MS-INVENTARIO
server.port=8084
# Base de datos: ${VARIABLE:valor-por-defecto}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/inventario_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
eureka.client.serviceurl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
# Clave del JWT: SIEMPRE desde variable de entorno
jwt.secret=${JWT_SECRET