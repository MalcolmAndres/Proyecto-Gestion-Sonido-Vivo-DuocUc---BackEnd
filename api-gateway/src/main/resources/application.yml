server:
  port: 8080

spring:
  application:
    name: API-GATEWAY
  cloud:
    gateway:
      server:
        webflux:
          # CORS: el navegador (Vite en 5173) puede llamar al gateway
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: "${FRONT_URL:http://localhost:5173}"
                allowedMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
                allowedHeaders: "*"
          # El ORDEN importa: gana la primera ruta que calza
          routes:
            - id: inventario            # antes que catalogo: /api/productos/1/stock
              uri: lb://MS-INVENTARIO
              predicates:
                - Path=/api/productos/*/stock, /api/inventario/**
            - id: catalogo
              uri: lb://MS-CATALOGO
              predicates:
                - Path=/api/productos/**, /api/categorias/**
            - id: auth
              uri: lb://MS-AUTH
              predicates:
                - Path=/api/auth/**
            - id: usuarios
              uri: lb://MS-USUARIOS
              predicates:
                - Path=/api/usuarios/**
            - id: ubicaciones
              uri: lb://MS-UBICACIONES
              predicates:
                - Path=/api/puntos-retiro/**
            - id: pedidos
              uri: lb://MS-PEDIDOS
              predicates:
                - Path=/api/pedidos/**, /api/reportes/**
            - id: pagos
              uri: lb://MS-PAGOS
              predicates:
                - Path=/api/pagos/**
            
            - id: carrito
              uri: lb://MS-CARRITO
              predicates:
                - Path=/api/carrito/**
            # /internal/** NO se publica: solo lo usan los microservicios entre ellos

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
